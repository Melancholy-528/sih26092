services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sih26092
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://sih:sih@db:5432/sih26092
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
